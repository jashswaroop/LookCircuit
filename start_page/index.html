<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Stitch</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style type="text/tailwindcss">
        :root {
            --primary-color: #6366F1;--secondary-color: #EC4899;--accent-color: #FBBF24;--background-color: #F9FAFB;
            --text-primary: #1F2937;
            --text-secondary: #6B7280;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--background-color);
        }
        .primary-gradient-bg {
            background-image: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased">
<div class="relative flex flex-col min-h-screen justify-between overflow-hidden">
<div class="absolute top-0 left-0 -translate-x-1/3 -translate-y-1/3 w-96 h-96 bg-[var(--primary-color)]/20 rounded-full filter blur-3xl opacity-50 animate-blob"></div>
<div class="absolute top-0 right-0 translate-x-1/3 -translate-y-1/3 w-96 h-96 bg-[var(--secondary-color)]/20 rounded-full filter blur-3xl opacity-50 animate-blob animation-delay-2000"></div>
<div class="absolute bottom-0 left-1/2 -translate-x-1/2 translate-y-1/3 w-96 h-96 bg-[var(--accent-color)]/20 rounded-full filter blur-3xl opacity-50 animate-blob animation-delay-4000"></div>
<main class="relative z-10 flex flex-col flex-grow px-6 pt-16 pb-8">
<div class="flex-shrink-0 flex justify-center items-center mb-8">
<div class="relative w-[300px] h-[300px] group">
<div class="absolute inset-0 primary-gradient-bg rounded-full opacity-20 transform scale-100 group-hover:scale-105 transition-transform duration-500 ease-in-out"></div>
<img alt="Fashion illustration" class="relative w-full h-full object-cover rounded-full transform group-hover:rotate-3 transition-transform duration-500 ease-in-out" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB3eDuhRYoj7uO8ZBhRkxBf9UHwmBrLkSpQWp6ihzJXuGY9P417-tGeM1aX8gHXjEs0BOCBuFTBv9eFmkSgB2l8fJHXQUQRaMIma6w4pq4pGP0EBwiE2f5FXWbqomYqqwQFXxEBjl7U1d7hZl8wCKvS-qi0k8-YYOstCVMR-oTMTeorU6fzl58xJuBLvyHNQD7Dr9Hg6oARWT5Hg4yaPYHMOdgIAd3A4Unj7DlSrDutjsyBetO2svMiuJHPGuHzChqk9eGIe5XHhO0"/>
</div>
</div>
<div class="text-center mb-10">
<h1 class="text-4xl font-extrabold text-[var(--text-primary)] tracking-tight mb-4">
                    Style, Reimagined.
                </h1>
<p class="text-lg text-[var(--text-secondary)] max-w-sm mx-auto">
                    Your personal AI stylist for a wardrobe that truly represents you.
                </p>
</div>
<div class="space-y-4 mb-12">
<div class="flex items-center bg-white/60 backdrop-blur-sm p-4 rounded-2xl shadow-sm hover:shadow-lg transition-all duration-300 transform hover:-translate-y-1 cursor-pointer">
<div class="p-3 primary-gradient-bg rounded-xl mr-4">
<svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</div>
<div>
<h3 class="font-bold text-[var(--text-primary)]">AI Recommendations</h3>
<p class="text-sm text-[var(--text-secondary)]">Outfits curated just for you.</p>
</div>
</div>
<div class="flex items-center bg-white/60 backdrop-blur-sm p-4 rounded-2xl shadow-sm hover:shadow-lg transition-all duration-300 transform hover:-translate-y-1 cursor-pointer">
<div class="p-3 primary-gradient-bg rounded-xl mr-4">
<svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</div>
<div>
<h3 class="font-bold text-[var(--text-primary)]">Digital Wardrobe</h3>
<p class="text-sm text-[var(--text-secondary)]">See all your clothes in one place.</p>
</div>
</div>
</div>
<div class="flex justify-center items-center gap-2 mb-6">
<div class="w-3 h-3 primary-gradient-bg rounded-full"></div>
<div class="w-2 h-2 bg-gray-300 rounded-full"></div>
<div class="w-2 h-2 bg-gray-300 rounded-full"></div>
</div>
</main>
<footer class="relative z-10 px-6 pb-8 pt-4">
<button class="w-full primary-gradient-bg text-white font-bold text-lg py-4 px-5 rounded-2xl shadow-lg hover:shadow-xl transition-shadow duration-300 transform hover:-translate-y-1">
                Let's Get Started
            </button>
</footer>
</div>
<style>
        @keyframes blob {
            0% {
                transform: translate(0px, 0px) scale(1);
            }
            33% {
                transform: translate(30px, -50px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
            100% {
                transform: translate(0px, 0px) scale(1);
            }
        }
        .animate-blob {
            animation: blob 7s infinite ease-in-out;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
        .animation-delay-4000 {
            animation-delay: 4s;
        }
    </style>

<script>
    const getStartedButton = document.querySelector('button');
    getStartedButton.addEventListener('click', () => {
        window.location.href = '/login_page/index.html';
    });
</script>

</body></html>
